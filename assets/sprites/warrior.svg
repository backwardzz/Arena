<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4f63"/><stop offset="1" stop-color="#1f2230"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e8f0"/><stop offset="1" stop-color="#7d8799"/>
    </linearGradient>
    <linearGradient id="cape" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3202a"/><stop offset="1" stop-color="#5a0d14"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9c2d4"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#9fe6ff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#2fa8ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#2fa8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="108" cy="240" rx="72" ry="8" fill="#000" opacity=".25"/>
  <g stroke="#120f18" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- cape flowing back -->
    <path d="M80 96 Q50 110 22 150 L30 158 L14 176 L34 178 L22 200 L48 190 L46 212 L64 186 Q80 150 96 104 Z" fill="url(#cape)"/>
    <path d="M70 120 Q52 150 36 176 M84 116 Q70 150 56 190" fill="none" stroke="#3d070c" stroke-width="2"/>
    <!-- ponytail -->
    <path d="M86 58 Q60 56 40 74 Q30 84 18 82 Q34 90 48 82 Q38 96 26 100 Q48 100 62 84 Q74 72 88 70 Z" fill="url(#hair)"/>
    <!-- back arm guard -->
    <polyline points="84,102 60,132 72,108" fill="none" stroke-width="22"/>
    <polyline points="84,102 60,132 72,108" fill="none" stroke="url(#armor)" stroke-width="16"/>
    <circle cx="73" cy="104" r="17" fill="url(#aura)" stroke="none"/>
    <path d="M63 98 L81 96 L84 110 L66 114 Z" fill="url(#steel)"/>
    <!-- legs -->
    <path d="M84 146 L106 152 L82 200 L72 230 L54 230 L62 198 Z" fill="url(#armor)"/>
    <path d="M98 152 L122 144 L146 186 L152 228 L134 230 L128 194 Z" fill="url(#armor)"/>
    <path d="M70 186 L80 190 L76 204 L64 200 Z" fill="url(#steel)" stroke-width="2"/>
    <path d="M132 176 L144 180 L146 194 L132 192 Z" fill="url(#steel)" stroke-width="2"/>
    <!-- boots -->
    <path d="M46 238 Q42 222 56 220 L74 222 Q80 232 74 238 Z" fill="#2a2d3a"/>
    <path d="M130 238 L130 224 L152 222 Q172 226 170 238 Z" fill="#2a2d3a"/>
    <!-- torso armor -->
    <path d="M72 94 Q100 82 130 92 L136 150 Q102 162 74 152 Z" fill="url(#armor)"/>
    <path d="M86 100 Q101 94 118 99 L114 126 Q101 132 90 126 Z" fill="url(#steel)" stroke-width="2.5"/>
    <path d="M78 146 Q104 156 134 144 L134 138 Q104 148 78 140 Z" fill="#6b3a1e" stroke-width="2"/>
    <!-- shoulder pauldrons -->
    <path d="M66 92 Q76 82 92 90 L88 104 Q76 106 66 102 Z" fill="url(#steel)"/>
    <path d="M114 88 Q132 82 138 96 L130 106 Q118 104 114 98 Z" fill="url(#steel)"/>
    <!-- runes -->
    <g stroke="#5fd4ff" stroke-width="2" fill="none" filter="url(#glow)">
      <path d="M98 106 L102 112 L98 118 M104 106 L104 120"/>
      <path d="M90 136 L96 132 L100 138 M112 134 L118 138"/>
      <path d="M68 210 L72 204 M138 206 L142 212 L138 216"/>
    </g>
    <!-- front arm jab -->
    <polyline points="122,100 148,124 166,108" fill="none" stroke-width="22"/>
    <polyline points="122,100 148,124 166,108" fill="none" stroke="url(#armor)" stroke-width="16"/>
    <circle cx="174" cy="104" r="22" fill="url(#aura)" stroke="none"/>
    <path d="M156 112 L164 100 L172 106 L164 118 Z" fill="url(#steel)" stroke-width="2"/>
    <path d="M166 94 Q182 92 184 104 Q184 116 170 116 Q162 110 166 94 Z" fill="url(#steel)"/>
    <path d="M172 98 L182 98 M170 104 L184 104 M170 110 L182 110" fill="none" stroke-width="1.5"/>
    <!-- lightning sparks -->
    <g stroke="#bdf0ff" stroke-width="1.8" fill="none" filter="url(#glow)">
      <path d="M186 92 L192 86 L190 94 L196 90"/>
      <path d="M188 114 L196 118 L190 120 L196 126"/>
      <path d="M60 94 L54 88 L58 92 L52 84"/>
    </g>
    <!-- head -->
    <path d="M82 62 Q80 88 98 95 Q118 95 121 70 Q121 52 102 50 Q84 50 82 62 Z" fill="#d9a07a"/>
    <path d="M86 78 Q92 92 100 93 Q114 92 118 80 Q108 86 100 86 Q92 86 86 78 Z" fill="#8a5e48" opacity=".4" stroke="none"/>
    <!-- hair top -->
    <path d="M80 68 Q76 44 100 42 Q124 42 124 64 Q116 54 104 54 Q96 60 86 58 Q84 64 80 68 Z" fill="url(#hair)"/>
    <path d="M122 60 Q130 66 128 76 Q124 70 120 68 Z" fill="url(#hair)" stroke-width="2"/>
    <path d="M110 52 Q118 60 116 70" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/>
    <!-- brows, glowing eyes, scar -->
    <path d="M92 64 L101 68 M106 68 L116 63" fill="none" stroke-width="3.5"/>
    <g filter="url(#glow)" stroke="none">
      <ellipse cx="97" cy="71" rx="3" ry="1.8" fill="#8fe8ff"/>
      <ellipse cx="110" cy="71" rx="3" ry="1.8" fill="#8fe8ff"/>
    </g>
    <path d="M113 60 L106 82" fill="none" stroke="#7a2a2a" stroke-width="2"/>
    <path d="M103 72 L101 79 L105 79" fill="none" stroke-width="2"/>
    <path d="M95 86 L110 86" fill="none" stroke-width="2.5"/>
    <path d="M82 66 Q77 70 83 74" fill="#d9a07a" stroke-width="2"/>
  </g>
</svg>
